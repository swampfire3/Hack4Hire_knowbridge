<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1714"/>
      <stop offset="1" stop-color="#2A211B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#6E482B" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1C1714" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#080604" flood-opacity=".48"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- Header / brand -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="64" y="52" width="42" height="42" rx="13" fill="#C8874A"/>
    <path d="M77 72c0-6 5-11 11-11s11 5 11 11-5 11-11 11c-2 0-4-.5-5.5-1.5L77 83l1.5-5.5C77.5 76 77 74 77 72z" fill="none" stroke="#241D19" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="85" cy="72" r="1.2" fill="#241D19"/><circle cx="88" cy="72" r="1.2" fill="#241D19"/><circle cx="91" cy="72" r="1.2" fill="#241D19"/>
    <text x="119" y="81" fill="#F3E8D5" font-size="23" font-weight="700" letter-spacing="-.4">KnowBridge</text>
    <text x="1216" y="78" fill="#B8A590" font-size="13" text-anchor="end">INTERNAL KNOWLEDGE PORTAL</text>
  </g>

  <!-- Decorative coffee-bean motif -->
  <g opacity=".16" fill="none" stroke="#D99A5E" stroke-width="2">
    <ellipse cx="205" cy="267" rx="40" ry="66" transform="rotate(-35 205 267)"/>
    <path d="M168 235c27 25 45 56 54 96"/>
    <ellipse cx="1068" cy="563" rx="31" ry="52" transform="rotate(28 1068 563)"/>
    <path d="M1042 532c22 17 38 43 45 72"/>
  </g>

  <!-- Login card -->
  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <rect x="420" y="142" width="440" height="548" rx="24" fill="#342923" stroke="#58483B" stroke-width="1.2"/>
    <rect x="614" y="180" width="52" height="52" rx="17" fill="#44362D" stroke="#72543B"/>
    <path d="M628 206c0-7 5-12 12-12s12 5 12 12-5 12-12 12c-2 0-4-.5-6-1.5l-6 2 2-6c-1.5-2-2-4-2-6.5z" fill="none" stroke="#D99A5E" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="637" cy="206" r="1.3" fill="#D99A5E"/><circle cx="641" cy="206" r="1.3" fill="#D99A5E"/><circle cx="645" cy="206" r="1.3" fill="#D99A5E"/>

    <text x="640" y="275" text-anchor="middle" fill="#F3E8D5" font-size="25" font-weight="700">Welcome back</text>
    <text x="640" y="303" text-anchor="middle" fill="#C9B9A5" font-size="14">Sign in to your authorized client workspace</text>

    <text x="472" y="357" fill="#E9DCC9" font-size="13" font-weight="600">Work email</text>
    <rect x="472" y="370" width="336" height="52" rx="12" fill="#241D19" stroke="#665346"/>
    <circle cx="494" cy="396" r="6" fill="none" stroke="#B8A590" stroke-width="1.6"/>
    <path d="M484 410c1.5-6 5-9 10-9s8.5 3 10 9" fill="none" stroke="#B8A590" stroke-width="1.6" stroke-linecap="round"/>
    <text x="520" y="401" fill="#9D8D7C" font-size="14">name@company.com</text>

    <text x="472" y="460" fill="#E9DCC9" font-size="13" font-weight="600">Password</text>
    <rect x="472" y="473" width="336" height="52" rx="12" fill="#241D19" stroke="#665346"/>
    <rect x="489" y="493" width="12" height="11" rx="2" fill="none" stroke="#B8A590" stroke-width="1.6"/>
    <path d="M492 493v-4a3 3 0 0 1 6 0v4" fill="none" stroke="#B8A590" stroke-width="1.6"/>
    <circle cx="495" cy="498" r="1.2" fill="#B8A590"/>
    <text x="520" y="505" fill="#B8A590" font-size="15" letter-spacing="3">••••••••••</text>
    <text x="808" y="548" fill="#D99A5E" text-anchor="end" font-size="12" font-weight="600">Forgot password?</text>

    <rect x="472" y="572" width="336" height="54" rx="13" fill="#C8874A"/>
    <text x="628" y="606" fill="#241D19" text-anchor="middle" font-size="15" font-weight="700">Sign in</text>
    <path d="M676 599h18m-6-6 6 6-6 6" fill="none" stroke="#241D19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M472 650h336" stroke="#58483B"/>
    <circle cx="502" cy="670" r="5" fill="#91A982"/>
    <text x="516" y="675" fill="#B8A590" font-size="11">Your role and client access are verified by the server</text>
  </g>

  <text x="640" y="755" font-family="Inter, Arial, sans-serif" fill="#8F7B68" font-size="12" text-anchor="middle">ESPRESSO BACKGROUND  •  MOCHA SURFACES  •  WARM CREAM TEXT  •  CARAMEL ACCENTS</text>
</svg>
