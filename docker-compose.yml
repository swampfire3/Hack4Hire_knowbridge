services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - ollama
    volumes:
      - ./backend:/app:Z
      - ./models:/models:ro,Z
      - document_data:/data/documents

  frontend:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:Z
      - frontend_node_modules:/app/node_modules

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowbridge}
      POSTGRES_USER: ${POSTGRES_USER:-knowbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-demo}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  document_data:
  frontend_node_modules:
